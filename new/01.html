<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>application</title>
    <style>

        body{
            display: flex;

            align-items: center;

            font-family: sans-serif;
            padding: 0px 0px;

        h2{

        .input{

        .bb{

        }
        img{

        }

        .bb p{
            margin: 0;
        }

        bb img{
            width: 50px;
            height: 50px;
            object-fit: contain;
        }

    </div>

    <div class="bb">
        <p><a href="<img src="./IMAGE/icons8-네이버-64.png" alt="네이버"></a>"></p>
        <p><a href="<img src="./IMAGE/icons8-카카오톡-24.png" alt="카카오톡"></a>"></p>
        <p><a href="<img src="./IMAGE/icons8-페이스북-24.png" alt="페이스북"></a>"></p>
