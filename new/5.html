<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VLIVE</title>
    <link rel="stylesheet" href="./5.css">
    <style>
        .cc:hover:hover-menu{display: block;}
    </style>
</head>
<body>
    <div>
        <div class="aa">
            <img src="./IMAGE/icons8-손-평화-50.png" alt="logo">
            <h2>VLIVE</h2>
        </div>
        <div class="bb">
            <img src="./IMAGE/icons8-돋보기-48.png" alt="검색">
        </div>
    </div>
    <div>
        <div class="cc" style="box-sizing: border-box;">
            <a href="https://ibighit.com/en/about/"><img src="./IMAGE/icons8-bts-64.png" alt="bts"></a>
            <a href="https://www.smentertainment.com/"><img src="./IMAGE/icons8-sm-48.png" alt="sm"></a>
            <a href="https://www.ygfamily.com/ko/main"><img src="./IMAGE/icons8-yg-선택-100.png" alt="yg"></a>
            <a href="https://www.jype.com/ko"><img src="./IMAGE/icons8-j-64.png" alt="jyp" ></a>
        </div>
        <div class="app-container">
            <div class="header-banner">
                <div class="artist-name">BTS</div>
                <div class="member-count">멤버</div>
                <button class="join-btn">가입</button>
            </div>
            <div class="chat-bar">
                채팅 참여하기
            </div>
            <div class="section">
                <div class="section">
                    <div class="section-title">From Star</div>
                    <a href="#" class="more-link">더보기</a>
                </div>
                <div class="star-card">
                    <img src="https://unsplash.com" alt="Live">
                    <div class="star-card-info">
                        <div class="star-card-title">방탄카페</div>
                        <div class="star-card-meta">▷◁</div>

                    </div>
                </div>

            </div>
        </div>
    </div>
</body>
</html>
