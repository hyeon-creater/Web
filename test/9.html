<!DOCTYPE html>
<html>
    <head>
        <title></title>
    </head>
    <body>
        <P><h1>프런트엔드 개발자 지원서</h1></P>
        <p>HTML, CSS, 자바스크립트의 기술을 이해하고 실무 경험이 있는 분을 찾습니다.</p>
        <hr>
        <br>
        <form>
        <h3>개인 정보</h3>
        <tr>
            <dl>
                <dt>
                    <dd>
                        <label for="name">이름</label>
                        <input type="text" id="name" placeholder="공백 없이 입력하세요.">
                        <br>
                        <label for="phonnumber">연락처</label>
                        <input type="number" id="phonnumber">                    
                    </dd>
                </dt>
            </dl>
                <p><h3>지원 분야</h3></p>
                <dl>
                    <dt>
                        <dd>               
                            <input type="radio" name="text1">
                            <label for="text1">웹 퍼블리싱</label>
                            <br>
                            <input type="radio" name="text2">
                            <label for="text2">웹 어플리케이션 개발</label>
                            <br>
                            <input type="radio" name="text3">
                            <label for="text3">개발 환경 개선</label>
                    </dd>
                </dt>
            </dl>
            <p><h3>지원 동기</h3></p>
            <br>
            <label for="review"></label>
            <textarea name="review" id="review" rows-="5" maxlength="60" placeholder="봉사 지원 동기를 간략히 써 주세요."></textarea>
        </tr>
        <br>
        <button type="submit">접수하기</button>
        <button type="reset">다시쓰기</button>
        </form>
    </body>
</html>
